name: bluesky_app
description: "Aura - A production-quality Bluesky-inspired social networking application for Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Navigation & State Management
  get: ^4.6.6

  # UI & Design System
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8

  # Media
  image_picker: ^1.1.2
  video_player: ^2.9.2

  # Network & AT Protocol
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6
  url_launcher: ^6.3.1

  # Utilities & Storage
  shared_preferences: ^2.5.2
  connectivity_plus: ^6.1.3
  uuid: ^4.5.1
  intl: ^0.20.2
  timeago: ^3.7.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/branding/